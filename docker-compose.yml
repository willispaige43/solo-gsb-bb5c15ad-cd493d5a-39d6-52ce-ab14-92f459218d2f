services:
  dimchain-api:
    build: .
    image: dimchain-api:latest
    container_name: dimchain-api
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口。宿主机端口可用环境变量 DIMCHAIN_PORT 覆盖
      - "${DIMCHAIN_PORT:-8000}:8000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_LOG_LEVEL: ${DIMCHAIN_LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
